# Cloudflare Pages project: the static page in public/ plus the API in functions/.
name = "flight-finder"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "flight-finder"
database_id = "5ad275f9-d373-43b0-b052-97e072013b7a"   # D1 database "flight-finder" (schema from migrations/0001_init.sql already applied)
migrations_dir = "migrations"

# Login codes are mailed with Cloudflare Email Sending (Workers Paid, a domain onboarded under Email Service).
[[send_email]]
name = "EMAIL"

[vars]
MAIL_FROM = "login@REPLACE_WITH_YOUR_DOMAIN"

# Secrets (never in this file):  wrangler pages secret put INGEST_TOKEN | AUTH_SECRET
