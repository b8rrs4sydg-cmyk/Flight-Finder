# Cloudflare Worker: the static page (public/) + the API (worker/index.js -> functions/api/*) + a D1 database.
# Deployed by the "Deploy to Cloudflare" button (see README / docs/cloudflare.md): the database is created (or reused by
# name) automatically, so no database_id is written here.
name = "flight-finder"
main = "worker/index.js"
compatibility_date = "2026-10-01"

workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "flight-finder"
# database_id is intentionally omitted: Cloudflare provisions or resolves the D1 binding on deploy.
migrations_dir = "migrations"

[vars]
# Sender of the login mails. With the Resend fallback (RESEND_API_KEY) it must be on a domain verified there;
# with Cloudflare Email Sending (uncomment the binding below) on a domain onboarded under Email Service.
MAIL_FROM = "Smart Flight Finder <login@example.com>"

# Login mails through Cloudflare Email Sending (Workers Paid, a domain that uses Cloudflare DNS):
# [[send_email]]
# name = "EMAIL"

# Workers Cache: public responses (/api/fares pages, Cache-Control: public, max-age=300) are served from Cloudflare's cache without running
# the Worker or reading D1; everything personal answers with no-store and is never cached.
[cache]
enabled = true

[observability]
enabled = true
