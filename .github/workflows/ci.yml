name: CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
      # data-only commits from the crawler / lookup daemon don't need CI
      - "!public/fares.json"
      - "!public/fares-live.json"
      - "!public/fares-live-*.json"
      - "!public/live-request.json"
      - "!public/daemon-status.json"
      - "!public/daemon-status-*.json"
      - "!public/daemon.json"
      - "!public/daemon-*.json"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
