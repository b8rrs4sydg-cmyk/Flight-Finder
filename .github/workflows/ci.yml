name: CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
      # data-only commits from the crawler / lookup daemon don't need CI
      - "!public/fares.json"
      - "!public/fares-live.json"
      - "!public/fares-live-*.json"
      - "!public/live-request.json"
      - "!public/daemon-status.json"
      - "!public/daemon-status-*.json"
      - "!public/daemon.json"
      - "!public/daemon-*.json"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  cloudflare-functions:
    name: Cloudflare Worker (D1 smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Local D1 + Worker dev server
        run: |
          npx wrangler d1 migrations apply DB --local
          setsid nohup npx wrangler dev --port 8801 \
            --var AUTH_SECRET:auto --var GENERATED_AUTH_SECRET:ci-secret --var INGEST_TOKEN:ci-token --var DEV_ECHO_CODE:1 > dev.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -s -m 2 localhost:8801/api/me > /dev/null && exit 0; sleep 2; done
          cat dev.log; exit 1
      - name: Smoke test (ingest, read, e-mail login, per-user state)
        run: BASE=http://localhost:8801 INGEST_TOKEN=ci-token node tests-cf/smoke.mjs
