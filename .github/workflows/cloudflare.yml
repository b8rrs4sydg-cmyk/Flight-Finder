name: Deploy to Cloudflare (manual)

# The "Deploy to Cloudflare" button (README) connects Cloudflare Workers Builds to the repository and deploys on every push.
# This workflow is the manual alternative: it runs the same `npm run deploy` (migrations + Worker + assets) from GitHub.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy (migrations, secrets, Worker)
        env:
          INGEST_TOKEN_VALUE: ${{ secrets.CF_INGEST_TOKEN }}
        run: |
          npm run deploy
          [ -n "$INGEST_TOKEN_VALUE" ] && printf '%s' "$INGEST_TOKEN_VALUE" | npx wrangler secret put INGEST_TOKEN
          true
